name: Repo Policy

on:
  pull_request:
    paths:

      - "crates/**"

      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"

      - "crates/syrup-rail-postgres/schema/**"
      - "scripts/check-schema-immutability.sh"
      - "scripts/tests/check-schema-immutability.sh"

      - ".github/workflows/repo-policy.yml"
  push:
    branches:
      - "main"
    paths:

      - "crates/**"

      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"

      - "crates/syrup-rail-postgres/schema/**"
      - "scripts/check-schema-immutability.sh"
      - "scripts/tests/check-schema-immutability.sh"

      - ".github/workflows/repo-policy.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-mod-rs:
    name: Check for disallowed mod.rs files
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Detect disallowed mod.rs files
        run: |
          scripts/jig check no-mod-rs

  rust-file-loc:
    name: Enforce agentic-first Rust file size policy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check Rust file LOC policy
        env:
          JIG_DEFAULT_BRANCH: "main"
        run: |
          set -euo pipefail
          if git rev-parse --verify "origin/$JIG_DEFAULT_BRANCH" >/dev/null 2>&1; then
            base_ref="$(git merge-base HEAD "origin/$JIG_DEFAULT_BRANCH")"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          fi
          echo "Using Rust LOC base ref: $base_ref"
          scripts/jig check rust-file-loc --changed-against "$base_ref"


  sqlx-metadata:
    name: Verify SQLx metadata against schema v1
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install SQLx CLI
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: sqlx-cli@0.8.6
      - name: Check SQLx metadata
        run: |
          scripts/jig check sqlx

  migration-immutability:
    name: Enforce migration immutability
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test schema immutability policy
        run: scripts/tests/check-schema-immutability.sh
      - name: Check shipped schema immutability
        run: scripts/check-schema-immutability.sh
