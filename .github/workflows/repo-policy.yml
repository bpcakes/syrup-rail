name: Repo Policy

on:
  pull_request:
    paths:

      - "crates/**"

      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"

      - "crates/syrup-rail-postgres/schema/**"
      - "scripts/check-schema-immutability.sh"
      - "scripts/tests/check-schema-immutability.sh"

      - ".github/workflows/repo-policy.yml"
  push:
    branches:
      - "master"
    paths:

      - "crates/**"

      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/jig"
      - "scripts/install-jig.sh"

      - "crates/syrup-rail-postgres/schema/**"
      - "scripts/check-schema-immutability.sh"
      - "scripts/tests/check-schema-immutability.sh"

      - ".github/workflows/repo-policy.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-mod-rs:
    name: Check for disallowed mod.rs files
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Detect disallowed mod.rs files
        run: |
          scripts/jig check no-mod-rs

  rust-file-loc:
    name: Enforce agentic-first Rust file size policy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check Rust file LOC policy
        env:
          JIG_DEFAULT_BRANCH: "master"
        run: |
          set -euo pipefail
          if git rev-parse --verify "origin/$JIG_DEFAULT_BRANCH" >/dev/null 2>&1; then
            base_ref="$(git merge-base HEAD "origin/$JIG_DEFAULT_BRANCH")"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          fi
          echo "Using Rust LOC base ref: $base_ref"
          scripts/jig check rust-file-loc --changed-against "$base_ref"


  sqlx-metadata:
    name: Verify SQLx metadata against schema v1
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install SQLx CLI
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: sqlx-cli@0.8.6
      - name: Check SQLx metadata
        run: |
          scripts/jig check sqlx

  migration-immutability:
    name: Enforce migration immutability
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Test schema immutability policy
        run: scripts/tests/check-schema-immutability.sh
      - name: Check shipped schema immutability
        run: scripts/check-schema-immutability.sh
      - name: Determine migration immutability base ref
        id: migration_base_ref
        shell: bash
        run: |
          set -euo pipefail

          empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          ref=""
          event_name="${{ github.event_name }}"

          if [[ "$event_name" == "pull_request" ]]; then
            ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event_name" == "push" ]]; then
            ref="${{ github.event.before }}"
            if [[ "$ref" == "0000000000000000000000000000000000000000" ]]; then
              ref="$empty_tree"
            fi
          elif [[ "$event_name" == "merge_group" ]]; then
            ref="${{ github.event.merge_group.base_sha }}"
          elif [[ "$event_name" == "workflow_dispatch" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              ref="HEAD^"
            else
              ref="$empty_tree"
            fi
          else
            echo "::error::Unsupported event for migration immutability: $event_name" >&2
            exit 1
          fi

          if [[ -z "$ref" ]]; then
            echo "::error::Migration immutability base ref is empty for $event_name" >&2
            exit 1
          fi

          if [[ "$ref" != "$empty_tree" ]] \
            && ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
            echo "Base ref $ref is not present locally; fetching it explicitly."
            if ! git fetch --no-tags origin "$ref"; then
              echo "::error::Cannot resolve migration immutability base ref $ref" >&2
              exit 1
            fi
          fi

          if [[ "$ref" != "$empty_tree" ]] \
            && ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
            echo "::error::Fetched migration immutability base ref $ref is not a commit" >&2
            exit 1
          fi

          if [[ "$event_name" == "push" && "$ref" != "$empty_tree" ]] \
            && [[ "$(git rev-parse "${ref}^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            echo "::error::Push base ref resolves to HEAD; refusing an empty immutability comparison" >&2
            exit 1
          fi

          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - name: Check recursive migration immutability
        run: |
          scripts/jig check migration-immutability --changed-against "${{ steps.migration_base_ref.outputs.ref }}"
