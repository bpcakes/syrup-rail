name: Repo Policy

on:
  pull_request:
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - "clippy.toml"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/**"
      - ".cargo/**"
      - ".github/workflows/**"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/releasing.md"
      - "docs/public-api.md"
      - "docs/security/dependency-advisories.md"
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - "clippy.toml"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/**"
      - ".cargo/**"
      - ".github/workflows/**"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/releasing.md"
      - "docs/public-api.md"
      - "docs/security/dependency-advisories.md"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-mod-rs:
    name: Check for disallowed mod.rs files
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check repository contract
        run: scripts/jig check contract
      - name: Detect disallowed mod.rs files
        run: |
          scripts/jig check no-mod-rs

  rust-file-loc:
    name: Enforce agentic-first Rust file size policy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Test CI comparison bases
        run: scripts/tests/ci-base-ref.sh
      - name: Check Rust file LOC policy
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          base_ref="$(scripts/ci-base-ref.sh)"
          echo "Using Rust LOC base ref: $base_ref"
          scripts/jig check rust-file-loc --changed-against "$base_ref"

  sqlx-metadata:
    name: Verify SQLx metadata against the current schema
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install SQLx CLI
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: sqlx-cli@0.8.6
      - name: Check SQLx metadata
        run: |
          scripts/jig check sqlx

  migration-immutability:
    name: Enforce migration immutability
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Test schema immutability policy
        run: scripts/tests/check-schema-immutability.sh
      - name: Check shipped schema immutability
        # Complete versioned artifacts become immutable at their first stable
        # release tag. The generic migration check also freezes unpublished
        # drafts and schema/current.rs, which must remain editable before release.
        run: scripts/check-schema-immutability.sh
