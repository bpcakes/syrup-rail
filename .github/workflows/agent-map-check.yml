name: Agent Map Check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "agent-map.md"

      - "crates/**"

      - ".jig/runtime-version"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - ".github/actions/setup-jig/**"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/agent-map-check.yml"
  push:
    branches:
      - "master"
      - "dev/0.6.0"
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "agent-map.md"

      - "crates/**"

      - ".jig/runtime-version"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - ".github/actions/setup-jig/**"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/agent-map-check.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-map-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-map-check:
    name: Verify AGENTS map drift
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pinned Jig
        uses: ./.github/actions/setup-jig

      - name: Validate agent-map links and coverage
        shell: bash
        run: |
          scripts/jig check agent-map
