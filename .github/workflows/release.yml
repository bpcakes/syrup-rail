name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version recorded in Cargo.toml and CHANGELOG.md
        required: true
        type: string

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require an approved release ref
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Run releases from main, not $RELEASE_REF." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          components: clippy,rustfmt

      - name: Install SQLx CLI
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: sqlx-cli@0.8.6

      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.2

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy

      - name: Check every workspace target at the MSRV
        env:
          SQLX_OFFLINE: "true"
          SQLX_OFFLINE_DIR: ${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx
        run: cargo +1.88.0 check --workspace --all-targets --locked

      - name: Check dependency advisories
        run: scripts/check-advisories.sh

      - name: Check public API documentation
        env:
          SQLX_OFFLINE: "true"
          SQLX_OFFLINE_DIR: ${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx
        run: scripts/check-public-api.sh

      - name: Check release metadata and packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/check-release.sh "$RELEASE_VERSION"

      - name: Check repository contract
        run: scripts/jig check contract

      - name: Check formatting
        run: scripts/jig check fmt

      - name: Run Clippy
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          SQLX_OFFLINE: "true"
          SQLX_OFFLINE_DIR: ${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx
        run: scripts/jig check clippy

      - name: Run locked tests
        env:
          SQLX_OFFLINE: "true"
          SQLX_OFFLINE_DIR: ${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx
        run: scripts/jig check test-locked

      - name: Verify SQLx metadata
        run: scripts/jig check sqlx

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          crate_version_exists() {
            local crate="$1"
            curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/$crate/$RELEASE_VERSION" \
              >/dev/null 2>&1
          }

          wait_for_crate_version() {
            local crate="$1"
            local attempt
            for attempt in {1..18}; do
              if crate_version_exists "$crate"; then
                return 0
              fi
              sleep 10
            done
            echo "$crate $RELEASE_VERSION did not become visible on crates.io." >&2
            return 1
          }

          publish_crate() {
            local crate="$1"
            if crate_version_exists "$crate"; then
              echo "$crate $RELEASE_VERSION is already published; continuing."
              return 0
            fi

            cargo publish --dry-run --locked -p "$crate"
            cargo publish --locked -p "$crate"
            wait_for_crate_version "$crate"
          }

          publish_crate syrup-rail
          publish_crate syrup-rail-nmi-client
          publish_crate syrup-rail-postgres
          publish_crate syrup-rail-nmi

  tag:
    name: Tag v${{ inputs.version }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create annotated release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Syrup Rail $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
