name: Rust Tests

on:
  pull_request:
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - "clippy.toml"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/**"
      - ".cargo/**"
      - ".github/workflows/**"
      - "LICENSE"
      - "NOTICE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/releasing.md"
      - "docs/public-api.md"
      - "docs/security/dependency-advisories.md"
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - "clippy.toml"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - "scripts/**"
      - ".cargo/**"
      - ".github/workflows/**"
      - "LICENSE"
      - "NOTICE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/releasing.md"
      - "docs/public-api.md"
      - "docs/security/dependency-advisories.md"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-wrapper:
    name: Release wrapper (${{ matrix.name }})
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current Bash
            runner: ubuntu-latest
            require_bash_32: "false"
          - name: Bash 3.2
            runner: macos-15
            require_bash_32: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test release wrapper argument handling
        env:
          RELEASE_TEST_REQUIRE_BASH_32: "${{ matrix.require_bash_32 }}"
        run: scripts/tests/check-release.sh

  packages:
    name: Development package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check workspace versions and package contents
        run: scripts/check-release.sh --development

  standalone-client:
    name: Standalone NMI client (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Cargo for packaging
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          toolchain: stable
      - name: Install test toolchain
        env:
          TEST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TEST_TOOLCHAIN" --profile minimal
      - name: Test the extracted package outside the workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: crates/syrup-rail-nmi-client/check-standalone.sh

  msrv:
    name: Rust 1.88 workspace check
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    env:
      SQLX_OFFLINE: "true"
      SQLX_OFFLINE_DIR: "${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          toolchain: 1.88.0
      - name: Check every workspace target at the MSRV
        run: cargo check --workspace --all-targets --locked

  advisories:
    name: Dependency advisory policy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test dependency advisory wrapper
        run: scripts/tests/check-advisories.sh
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.2
      - name: Check dependency advisories
        run: scripts/check-advisories.sh

  public-api:
    name: Public API documentation
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    env:
      SQLX_OFFLINE: "true"
      SQLX_OFFLINE_DIR: "${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Check explicit facades and documentation
        run: scripts/check-public-api.sh

  fmt:
    name: scripts/jig check fmt
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          components: rustfmt
      - name: Test Rust source discovery
        run: scripts/tests/check-rustfmt.sh
      - name: Run rustfmt check
        run: scripts/jig check fmt

  clippy:
    name: scripts/jig check clippy
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    env:
      SQLX_OFFLINE: "true"
      SQLX_OFFLINE_DIR: "${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
          toolchain: 1.88.0
          components: clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Run clippy
        run: scripts/jig check clippy

  test:
    name: scripts/jig check test-locked
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash

    env:
      SQLX_OFFLINE: "true"
      SQLX_OFFLINE_DIR: "${{ github.workspace }}/crates/syrup-rail-postgres/.sqlx"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Run locked Rust tests
        run: scripts/jig check test-locked
